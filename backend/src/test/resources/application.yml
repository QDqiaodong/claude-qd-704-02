server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:drill;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-h2.sql
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

drill:
  timeout:
    sweep-ms: 1000

logging:
  level:
    root: WARN
    com.fire.protect: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
